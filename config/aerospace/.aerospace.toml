config-version = 2

after-startup-command = [
  'exec-and-forget borders style=round active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0'
]

start-at-login = true

auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = true

on-window-detected = [
    { if.app-id = 'com.tinyspeck.slackmacgap', run = 'move-node-to-workspace 1' },
    { if.app-id = 'com.brave.Browser', run = 'move-node-to-workspace 2' },
    { if.app-id = 'com.mitchellh.ghostty', run = 'move-node-to-workspace 3' },
    { if.app-id = 'com.hnc.Discord', run = 'move-node-to-workspace 4' },
    { if.app-id = 'com.spotify.client', run = 'move-node-to-workspace 5' },
]

focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 16
gaps.inner.vertical =   16
gaps.outer.left =       16
gaps.outer.bottom =     16
gaps.outer.top =        16
gaps.outer.right =      16

[mode.main.binding]
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'

    ctrl-shift-1 = ['move-node-to-workspace 1 --focus-follows-window', 'fullscreen on']
    ctrl-shift-2 = ['move-node-to-workspace 2 --focus-follows-window', 'fullscreen on']
    ctrl-shift-3 = ['move-node-to-workspace 3 --focus-follows-window', 'fullscreen on']
    ctrl-shift-4 = ['move-node-to-workspace 4 --focus-follows-window', 'fullscreen on']
    ctrl-shift-5 = ['move-node-to-workspace 5 --focus-follows-window', 'fullscreen on']
    ctrl-shift-6 = ['move-node-to-workspace 6 --focus-follows-window', 'fullscreen on']
    ctrl-shift-7 = ['move-node-to-workspace 7 --focus-follows-window', 'fullscreen on']
    ctrl-shift-8 = ['move-node-to-workspace 8 --focus-follows-window', 'fullscreen on']
    ctrl-shift-9 = ['move-node-to-workspace 9 --focus-follows-window', 'fullscreen on']

    alt-shift-i = '''exec-and-forget osascript -e 'tell application "Ghostty" to new window' '''
    alt-shift-b = 'exec-and-forget open -na "Brave Browser"'
    alt-shift-m = 'move-workspace-to-monitor --wrap-around next'
    alt-space = 'fullscreen'
    alt-q = 'close'
    alt-r = 'reload-config'

[workspace-to-monitor-force-assignment]
    1 = 'main'
    2 = 'main'
    3 = 'secondary'
    4 = 'main'
    5 = 'main'
